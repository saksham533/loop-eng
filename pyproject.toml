[project]
name = "pulsecheck-mocks"
version = "0.1.0"
description = "Three mock services and 12-loop agentic auto-healing runtime."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]